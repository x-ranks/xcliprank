name = "twizou-googlebot-production-canary"
main = "worker.mjs"
compatibility_date = "2025-12-01"
workers_dev = false
preview_urls = false

# The route (twizou.net/*, fail open) is managed in the Cloudflare dashboard and is kept by `wrangler deploy`.
routes = []

# Keep this table last. Only the Worker's own log lines are recorded (Google-looking requests), not every request.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false
