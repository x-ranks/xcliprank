name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical source
        run: npm run check:source

      - name: Isolated offline regressions
        run: npm run test:offline

      - name: Isolated type check
        run: node scripts/check-canonical.cjs types

      - name: Isolated build without database or provider access
        run: node scripts/check-canonical.cjs build

