name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical source
        run: npm run check:source

      - name: Isolated offline regressions
        run: npm run test:offline

      - name: Isolated type check
        run: node scripts/check-canonical.cjs types

      - name: Isolated build without database or provider access
        run: node scripts/check-canonical.cjs build


  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: production/source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: production/source/package-lock.json
      - name: Verify live snapshot and reviewed candidate
        run: node ../../scripts/verify-production-source.cjs
      - run: npm ci
      - name: Offline production regressions
        run: node scripts/check-canonical.cjs test
      - name: Offline production types
        run: node scripts/check-canonical.cjs types
      - name: Offline actual standalone build
        run: node scripts/build-production-offline.cjs

  deployment-package-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Linux API allowlist transaction and HTTP verifier tests
        run: node tools/public-labels-pages-v2/test-deployment.cjs
      - name: Delivered deployment syntax
        run: bash -n tools/xclip-public-labels-pages-deploy-20261018-v2.sh

  auto-label-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployment syntax and exact embedded payload hashes
        run: |
          bash -n tools/xclip-auto-labels-mobile-deploy-20261018.sh
          python3 tools/verify-auto-label-distribution.py
