name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify canonical source
        run: npm run check:source

      - name: Isolated offline regressions
        run: npm run test:offline

      - name: Isolated type check
        run: node scripts/check-canonical.cjs types

      - name: Isolated build without database or provider access
        run: node scripts/check-canonical.cjs build

      - name: Offline curated recovery tests
        run: node scripts/test-curated-recovery.cjs

      - name: Offline video metadata tests
        run: node scripts/test-video-duration.cjs

      - name: Offline ranking liquidity tests
        run: node scripts/test-ranking-liquidity.cjs

      - name: Offline ranking API integration test
        run: node scripts/test-ranking-liquidity-route.cjs

      - name: Offline curated expiry tests
        run: node scripts/test-curated-expiry.cjs

      - name: Offline free expiry cleanup test
        run: node scripts/test-curated-expiry-cleanup.cjs
